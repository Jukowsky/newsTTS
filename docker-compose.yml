services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/newstts.db
      - AUDIO_DIR=/app/data/audio_files
    volumes:
      - data:/app/data
      - logs:/app/backend/logs

volumes:
  data:
  logs:
